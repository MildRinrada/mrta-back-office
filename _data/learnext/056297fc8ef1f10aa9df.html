<form id="frm_main" class="lx-form" action="/learnext/admin/materials/store" method="POST" enctype="multipart/form-data">
	<input type="hidden" name="_token" value="demo-token" autocomplete="off">	<input type="hidden" name="type" value="Assignment">
	<input type="hidden" name="modal_assignment_chapter_item_id" value="11">

	<div class="row g-3">
		<div class="col-12">
			<label class="form-label" for="txt_title">ชื่อสื่อ<span class="req">*</span></label>
			<input id="txt_title" name="title" type="text" class="form-control" maxlength="255" required autofocus autocomplete="off" value="กรมการขนส่งทางราง – มาตรฐานและกฎหมายความปลอดภัยระบบราง">
		</div>
		<div class="col-12">
			<label class="form-label" for="txt_instruction">คำสั่งงาน<span class="req">*</span></label>
			<textarea id="txt_instruction" name="modal_assignment_instruction" class="form-control" rows="6" required placeholder="อธิบายสิ่งที่ผู้เรียนต้องทำ รูปแบบไฟล์ที่ต้องส่ง เกณฑ์การให้คะแนน ฯลฯ"></textarea>
		</div>
		<div class="col-md-4">
			<label class="form-label" for="txt_score">คะแนนเต็ม<span class="req">*</span></label>
			<input id="txt_score" name="modal_assignment_total_score" type="number" class="form-control" min="1" step="1" required placeholder="20" value="">
		</div>
		<div class="col-md-8">
			<label class="form-label d-block">กำหนดส่ง</label>
			<div class="d-flex flex-wrap gap-2">
				<input type="date" name="hd_modal_assignment_deadline_at" class="form-control" style="max-width:190px" aria-label="วันที่" value="">
				<input type="time" name="hd_modal_assignment_deadline_time_at" class="form-control" style="max-width:130px" aria-label="เวลา" value="">
			</div>
			<div class="lx-help"><i class="fa-solid fa-circle-info"></i>เว้นว่างได้ถ้าไม่กำหนด</div>
		</div>

		<div class="col-12">
			<label class="form-label d-block">รูปแบบการส่งงาน</label>
			<div class="lx-choices">
				<label class="form-check"><input class="form-check-input" type="radio" name="typeass" value="file" checked> <span class="form-check-label">ผู้เรียนส่งไฟล์</span></label>
				<label class="form-check"><input class="form-check-input" type="radio" name="typeass" value="url" > <span class="form-check-label">ผู้เรียนตอบแบบฟอร์มออนไลน์</span></label>
			</div>
		</div>
		<div class="col-lg-8" data-src="file" class="">
			<label class="form-label" for="file_attach">ไฟล์ประกอบ (ถ้ามี)</label>
			<input id="file_attach" name="modal_assignment_chapter_item_file" type="file" class="form-control" accept=".pdf,.txt,.zip,.rar,.jpg,.jpeg,.png,.gif,.bmp,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
			<div class="lx-help"><i class="fa-solid fa-circle-info"></i>รองรับ .pdf .doc .docx .xls .xlsx .ppt .pptx .zip .rar .txt และรูปภาพ .jpg .jpeg .png .gif .bmp (มีหลายไฟล์ให้บีบอัดเป็น .zip หรือ .rar) ขนาดไม่เกิน 500 MB</div>
					</div>
		<div class="col-lg-8" data-src="url" class="d-none">
			<label class="form-label" for="ddl_queryform">แบบฟอร์ม</label>
			<select id="ddl_queryform" name="modal_assignment_chapter_item_url" class="form-select">
				<option value="">เลือกแบบฟอร์ม</option>
									<option value="4" >test</option>
									<option value="11" >แบบฝึกหัดอัตนัย: วิเคราะห์ความเสี่ยงหน้างานบนทางวิ่ง</option>
									<option value="12" >แบบบันทึกผลการฝึกซ้อมอพยพผู้โดยสารในสถานี</option>
									<option value="13" >แบบสำรวจความต้องการฝึกอบรมประจำปีงบประมาณ 2570</option>
							</select>
		</div>
	</div>

	<input type="hidden" id="save_option" name="save_option" value="1">
<div class="lx-form-footer">
	<span class="lx-footer-note">* จำเป็นต้องกรอก</span>
	<a href="/learnext/admin/materials/list" class="btn btn-outline-secondary" data-lx-cancel>ยกเลิก</a>
		<button type="button" id="btn_save" class="btn btn-primary" data-lx-save="1" onclick="lxSubmit(1, this)"><span class="spinner-border"></span><i class="fa-solid fa-check"></i> บันทึก</button>
</div>
</form>

<script>
(function () {
	function sync() {
		var v = $('input[name=typeass]:checked').val() || 'file';
		$('[data-src]').each(function () { $(this).toggleClass('d-none', $(this).data('src') !== v); });
	}
	$('input[name=typeass]').on('change', sync);
	sync();
})();
</script>
