<form id="frm_main" class="lx-form" action="/learnext/admin/materials/store" method="POST" enctype="multipart/form-data">
	<input type="hidden" name="_token" value="demo-token" autocomplete="off">	<input type="hidden" name="type" value="Video">
	<input type="hidden" name="mat_id" value="9">

	<div class="row g-3">
		<div class="col-12">
			<label class="form-label" for="txt_title">ชื่อสื่อ<span class="req">*</span></label>
			<input id="txt_title" name="title" type="text" class="form-control" maxlength="255" required autofocus autocomplete="off" value="วิดีโอ: ขั้นตอนอพยพผู้โดยสารออกจากขบวนรถในอุโมงค์">
		</div>
		<div class="col-lg-8">
			<label class="form-label" for="file_video">ไฟล์<span class="req">*</span></label>
			<input id="file_video" name="modal_file_chapter_item_file" type="file" class="form-control" accept=".mp4,.avi,.flv,.mpeg,.mpg,.wmv,.3gp,.mp3,.wav,video/mp4,audio/mpeg,audio/wav" required>
			<div class="lx-help">
				<div><i class="fa-solid fa-circle-info"></i>รองรับ .mp4 .avi .flv .mpeg .wmv .3gp .mp3 .wav ขนาดไม่เกิน 2 GB (เล่นบนเว็บได้เฉพาะ .mp4 ชนิดอื่นผู้เรียนจะได้ปุ่มดาวน์โหลดแทน)</div>
							</div>
					</div>

		<div class="col-12">
			<div class="lx-subcard">
				<div class="lx-subcard-title">
					<span><i class="fa-solid fa-circle-question me-1 text-muted"></i> คำถามแทรกระหว่างชมวิดีโอ</span>
					<button type="button" id="btn_add_bank" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-plus"></i> เพิ่มคลังข้อสอบ</button>
				</div>
				<div class="lx-help mb-3 mt-0">ไม่บังคับ - เลือกคลังข้อสอบและจำนวนข้อ ระบบจะสุ่มถามเป็นช่วง ๆ ระหว่างชม</div>

				<div id="panel_video_quiz_list" class="d-grid gap-2"></div>

				<div class="row g-3 mt-1">
					<div class="col-md-4">
						<label class="form-label" for="modal_quiz_total_question_video">จำนวนคำถามรวม</label>
						<input type="number" name="modal_quiz_total_question_video" id="modal_quiz_total_question_video" class="form-control" readonly tabindex="-1">
					</div>
					<div class="col-md-4">
						<label class="form-label" for="popup_number">จำนวนครั้งที่แทรก</label>
						<input type="number" name="popup_number" id="popup_number" class="form-control" value="0" min="0" max="20">
					</div>
					<div class="col-md-4">
						<label class="form-label d-block">คำถามต่อครั้ง</label>
						<div id="layout_number_popup" class="d-flex flex-wrap gap-2"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<input type="hidden" id="save_option" name="save_option" value="1">
<div class="lx-form-footer">
	<span class="lx-footer-note">* จำเป็นต้องกรอก</span>
	<a href="/learnext/admin/materials/list" class="btn btn-outline-secondary" data-lx-cancel>ยกเลิก</a>
		<button type="button" id="btn_save" class="btn btn-primary" data-lx-save="1" onclick="lxSubmit(1, this)"><span class="spinner-border"></span><i class="fa-solid fa-check"></i> บันทึก</button>
</div>
</form>

<template id="tpl_bank_row">
	<div class="lx-bank-row row g-2 align-items-end">
		<div class="col-md-7">
			<select name="modal_quiz_question_bank_video_id[]" class="form-select choose_question_bank">
				<option value="">เลือกคลังข้อสอบ</option>
									<option value="13" data-total-q="2">test (2 ข้อ)</option>
									<option value="24" data-total-q="8">คลังข้อสอบ การบริการผู้โดยสารและการจัดการเหตุขัดข้อง (8 ข้อ)</option>
									<option value="25" data-total-q="8">คลังข้อสอบ การบริหารสัญญาและควบคุมงานก่อสร้างรถไฟฟ้า (8 ข้อ)</option>
									<option value="23" data-total-q="10">คลังข้อสอบ ความปลอดภัยในการปฏิบัติงานบนทางวิ่ง (10 ข้อ)</option>
							</select>
			<input type="hidden" name="hd_total_questions_in_bank_by_id_video[]" value="">
		</div>
		<div class="col-md-3">
			<input type="number" min="0" class="form-control each_total_quiz_video" name="modal_quiz_total_question_list_by_id_video[]" placeholder="จำนวนข้อ">
		</div>
		<div class="col-md-2">
			<button type="button" class="btn btn-sm btn-outline-danger btn-del-row w-100" title="ลบแถวนี้"><i class="fa-regular fa-trash-can"></i></button>
		</div>
	</div>
</template>
<template id="tpl_popup_row">
	<input type="number" name="popup_number_count[]" min="1" value="1" class="form-control popup_number_count" style="width:80px" title="Popup __N__">
</template>

<script>
(function () {
	var $list = $('#panel_video_quiz_list');
	function refresh() {
		var t = 0;
		$list.find('.each_total_quiz_video').each(function () { t += Number(this.value) || 0; });
		$('#modal_quiz_total_question_video').val(t);
		$list.find('.btn-del-row').prop('disabled', $list.children().length <= 1);
	}
	function addRow(bank, count) {
		var $r = $($('#tpl_bank_row').html());
		if (bank) $r.find('select').val(String(bank));
		if (count !== undefined && count !== null) $r.find('.each_total_quiz_video').val(count);
		$list.append($r);
		$r.find('select').on('change', function () { $(this).next('input[type=hidden]').val($(this).find(':selected').data('total-q') || ''); }).trigger('change');
		refresh();
	}
	function popups() {
		var n = Math.max(0, Math.min(20, parseInt($('#popup_number').val(), 10) || 0)), $p = $('#layout_number_popup');
		while ($p.children().length < n) $p.append($('#tpl_popup_row').html().replace(/__N__/g, $p.children().length + 1));
		while ($p.children().length > n) $p.children().last().remove();
	}
	$('#btn_add_bank').on('click', function () { addRow(); $list.find('select').last().focus(); });
	$list.on('click', '.btn-del-row', function () { $(this).closest('.lx-bank-row').remove(); refresh(); });
	$list.on('input', '.each_total_quiz_video', refresh);
	$('#popup_number').on('input change', popups);

	var saved = null;
	if (saved) {
		(saved.list_questions || []).forEach(function (q) { addRow(q.question_id, q.count); });
		$('#popup_number').val(saved.total_popup || 0);
		popups();
		(saved.popup_info || []).forEach(function (p, i) { $('#layout_number_popup .popup_number_count').eq(i).val(p.count_question || 1); });
	}
	if (!$list.children().length) addRow();
	popups();
	refresh();
})();
</script>
